<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>11.11秒チャレンジ</title>

<style>
    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: white;
        color: #222;
        font-family: sans-serif;
        user-select: none;
    }

    #gameContainer {
        width: 100%;
        height: 100%;
        box-sizing: border-box;
        text-align: center;
        padding-top: 80px;
        position: relative;
        z-index: 1;
    }

    h1 {
        font-size: 40px;
        margin-bottom: 30px;
    }

    #target {
        font-size: 30px;
        margin-bottom: 20px;
    }

    #timer {
        font-size: 70px;
        font-weight: bold;
        margin: 20px;
    }

    #message {
        font-size: 20px;
        margin: 20px;
        min-height: 30px;
    }

    button {
        font-size: 24px;
        padding: 12px 35px;
        cursor: pointer;
        position: relative;
        z-index: 100;
    }

    #reward {
        font-size: 20px;
        margin-top: 20px;
        font-weight: bold;
        color: #d00000;
    }

    /* ガラスクラッシュ Canvas */
    #crackCanvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
        z-index: 10000;
    }

    /* 結果演出画面 */
    #effect {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: black;
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        z-index: 9999;
        overflow: hidden;
        cursor: pointer;
    }

    #effect.dark {
        display: flex !important;
    }

    #resultDigits {
        font-size: 75px;
        font-family: monospace;
        font-weight: bold;
        color: white;
        letter-spacing: 5px;
        text-shadow: 0 0 10px #00ffff, 0 0 25px #0088ff;
        min-height: 90px;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .digitChar {
        display: inline-block;
        transition: transform 0.8s ease-in, opacity 0.8s ease-in;
    }

    .digitChar.popOut {
        color: #ff3333 !important;
        text-shadow: 0 0 25px #ff0000 !important;
        transform: translateY(-90px) scale(1.8) rotate(25deg);
        opacity: 0;
    }

    .digitChar.pushUp {
        animation: pushUpAnim 1.0s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes pushUpAnim {
        0% { transform: translateY(120px) scale(0.2); opacity: 0; color: #ffd700; text-shadow: 0 0 30px gold; }
        70% { transform: translateY(-15px) scale(1.4); opacity: 1; color: #ffd700; text-shadow: 0 0 30px gold; }
        100% { transform: translateY(0) scale(1); opacity: 1; color: white; text-shadow: 0 0 10px #00ffff, 0 0 25px #0088ff; }
    }

    #resultType {
        font-size: 55px;
        font-weight: bold;
        margin-top: 30px;
        min-height: 90px;
        text-align: center;
        padding: 0 20px;
    }

    #resultReward {
        font-size: 35px;
        font-weight: bold;
        margin-top: 25px;
        color: white;
        text-shadow: 0 0 10px white, 0 0 20px gold;
        opacity: 0;
    }

    #resultReward.show {
        animation: rewardAppear 0.8s ease forwards;
    }

    .retryHint {
        margin-top: 40px;
        font-size: 18px;
        color: #888;
        opacity: 0;
        transition: opacity 0.5s;
    }

    .retryHint.show {
        opacity: 1;
    }

    .perfect {
        animation: perfectAppear 0.8s ease forwards, rainbowText 1.2s linear infinite;
    }

    @keyframes perfectAppear {
        0% { transform: scale(0.2); opacity: 0; }
        60% { transform: scale(1.2); opacity: 1; }
        100% { transform: scale(1); opacity: 1; }
    }

    @keyframes rainbowText {
        0% { color: red; text-shadow: 0 0 20px red; }
        16% { color: orange; text-shadow: 0 0 20px orange; }
        33% { color: yellow; text-shadow: 0 0 20px yellow; }
        50% { color: lime; text-shadow: 0 0 20px lime; }
        66% { color: cyan; text-shadow: 0 0 20px cyan; }
        83% { color: blue; text-shadow: 0 0 20px blue; }
        100% { color: magenta; text-shadow: 0 0 20px magenta; }
    }

    .great {
        color: #00ffff;
        text-shadow: 0 0 15px #00ffff;
        animation: simpleAppear 0.5s ease forwards;
    }

    @keyframes simpleAppear {
        from { transform: scale(0.8); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
    }

    /* 金文字「激熱」カットイン */
    #cutinOverlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
        z-index: 10002;
        display: none;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    #cutinOverlay.show {
        display: flex;
    }

    .cutinText {
        font-size: 130px;
        font-weight: 900;
        font-family: 'Hiragino Mincho ProN', 'Yu Mincho', serif;
        background: linear-gradient(180deg, #ffffff 0%, #fff0a0 30%, #ffd700 60%, #b8860b 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        letter-spacing: 25px;
        filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.8)) drop-shadow(0 0 30px rgba(255, 140, 0, 0.8));
        transform: scale(0.3);
        opacity: 0;
        animation: gekiatsuAnim 2.0s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
    }

    @keyframes gekiatsuAnim {
        0% { transform: scale(2.8); opacity: 0; filter: blur(12px) drop-shadow(0 0 40px gold); }
        15% { transform: scale(1.05); opacity: 1; filter: drop-shadow(0 0 20px gold) drop-shadow(0 0 40px rgba(255,69,0,0.8)); }
        80% { transform: scale(1.0); opacity: 1; filter: drop-shadow(0 0 25px gold) drop-shadow(0 0 50px rgba(255,69,0,0.9)); }
        100% { transform: scale(0.7); opacity: 0; filter: blur(8px); }
    }

    /* 景品分配ルーレット画面 */
    #rouletteOverlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.93);
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        z-index: 10001;
        color: white;
        cursor: pointer;
    }

    #rouletteOverlay.show {
        display: flex !important;
    }

    .rouletteTitle {
        font-size: 28px;
        margin-bottom: 25px;
        color: #ffd700;
        text-shadow: 0 0 10px gold;
    }

    .slotsContainer {
        display: flex;
        gap: 15px;
        justify-content: center;
        align-items: center;
        margin-bottom: 20px;
    }

    .slotCard {
        width: 100px;
        padding: 15px 5px;
        border: 3px solid #ffd700;
        border-radius: 12px;
        background: #151515;
        text-align: center;
        box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
    }

    .slotName {
        font-size: 18px;
        color: #ccc;
        margin-bottom: 10px;
        font-weight: bold;
    }

    .slotValue {
        font-size: 38px;
        font-weight: bold;
        color: #fff;
        min-height: 45px;
    }

    .slotValue.decided {
        color: #00ffff;
        text-shadow: 0 0 12px #00ffff;
        animation: popItem 0.3s ease;
    }

    @keyframes popItem {
        0% { transform: scale(0.6); }
        70% { transform: scale(1.3); }
        100% { transform: scale(1); }
    }

    #rouletteResultText {
        font-size: 24px;
        font-weight: bold;
        margin-top: 15px;
        min-height: 40px;
        color: #ff3366;
        text-shadow: 0 0 10px #ff3366;
    }

    #flash {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: white;
        opacity: 0;
        pointer-events: none;
        z-index: 10001;
    }

    #flash.active { animation: flash 0.45s ease; }

    @keyframes flash {
        0% { opacity: 0; }
        20% { opacity: 1; }
        100% { opacity: 0; }
    }

    @keyframes rewardAppear {
        0% { transform: scale(0.5); opacity: 0; }
        70% { transform: scale(1.15); opacity: 1; }
        100% { transform: scale(1); opacity: 1; }
    }

    .particle {
        position: absolute;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: white;
        box-shadow: 0 0 8px white, 0 0 18px yellow;
        pointer-events: none;
    }
</style>
</head>

<body>

<div id="gameContainer">
    <h1>11.11秒チャレンジ</h1>

    <div id="target">目標：11.11秒</div>

    <div id="timer">0.00</div>

    <div id="message">
        STARTを押して11.11秒を目指せ！
    </div>

    <button id="startButton">START</button>

    <div id="reward"></div>
</div>

<!-- 画面割れ演出用Canvas -->
<canvas id="crackCanvas"></canvas>

<!-- 金文字激熱カットイン -->
<div id="cutinOverlay">
    <div class="cutinText">激熱</div>
</div>

<!-- 暗転結果演出 -->
<div id="effect">
    <div id="resultDigits"></div>
    <div id="resultType"></div>
    <div id="resultReward"></div>
    <div id="retryHint" class="retryHint">Enterキーかタップで次へ</div>
</div>

<!-- 景品分配ルーレット画面 -->
<div id="rouletteOverlay">
    <div class="rouletteTitle" id="rouletteTitle">🎁 合計 0個 を分配中… 🎁</div>

    <div class="slotsContainer">
        <div class="slotCard">
            <div class="slotName">ポッキー</div>
            <div class="slotValue" id="slot0">?</div>
        </div>
        <div class="slotCard">
            <div class="slotName">プリッツ</div>
            <div class="slotValue" id="slot1">?</div>
        </div>
        <div class="slotCard">
            <div class="slotName">トッポ</div>
            <div class="slotValue" id="slot2">?</div>
        </div>
    </div>

    <div id="rouletteResultText"></div>
    <div id="rouletteHint" class="retryHint">Enterキーかタップで確定</div>
</div>

<div id="flash"></div>

<script>
/* =========================================================
 * ⚙️ テストモード設定
 * ---------------------------------------------------------
 * 0 : 本番モード（プレイヤーの実力通り判定）
 * 1 : 失敗（0個獲得） (12.45秒)
 * 2 : いいね（1個獲得・暗転なし） (11.35秒)
 * 3 : GREAT（3個獲得・11.1一致なら割れ / 11.のみなら一括表示）
 * 4 : PERFECT（11個獲得・11.12ハズレ ➔ 画面割れ ➔ 激熱2秒 ➔ 押し上げ昇格）
 * ========================================================= */
const TEST_MODE = 4;

const TARGET_TIME = 11.11;
const VISIBLE_TIME = 3.33;

const RANGE_PERFECT = 0.01;
const RANGE_GREAT   = 0.10;
const RANGE_GOOD    = 0.50;

const DARK_TIME = 800;
const DIGIT_INTERVAL = 900;

/* ゲーム状態 */
let running = false;
let startTime = 0;
let timerId = null;
let finalTime = 0;
let displayTimeStr = "";
let lastStartTime = 0;

let effectTimeouts = []; 

let showingResult = false;
let canAdvanceFromResult = false;
let showingFailure = false;  // 失敗画面状態管理フラグ
let showingGood = false;     // いいね（1個獲得）画面状態管理フラグ

let earnedCount = 0;
let finalAllocation = [0, 0, 0];

let rouletteSpinning = false;
let rouletteReadyToClose = false;
let rouletteTimer = null;
let lastRouletteOpenTime = 0;
let lastResetTime = 0;

/* HTML要素 */
const gameContainer = document.getElementById("gameContainer");
const timer = document.getElementById("timer");
const message = document.getElementById("message");
const startButton = document.getElementById("startButton");
const reward = document.getElementById("reward");

const crackCanvas = document.getElementById("crackCanvas");
const ctx = crackCanvas.getContext("2d");

const cutinOverlay = document.getElementById("cutinOverlay");

const effect = document.getElementById("effect");
const resultDigits = document.getElementById("resultDigits");
const resultType = document.getElementById("resultType");
const resultReward = document.getElementById("resultReward");
const retryHint = document.getElementById("retryHint");

const rouletteOverlay = document.getElementById("rouletteOverlay");
const rouletteTitle = document.getElementById("rouletteTitle");
const slot0 = document.getElementById("slot0");
const slot1 = document.getElementById("slot1");
const slot2 = document.getElementById("slot2");
const rouletteResultText = document.getElementById("rouletteResultText");
const rouletteHint = document.getElementById("rouletteHint");

const flash = document.getElementById("flash");

function resizeCanvas() {
    crackCanvas.width = window.innerWidth;
    crackCanvas.height = window.innerHeight;
}
window.addEventListener("resize", resizeCanvas);
resizeCanvas();

function addTimeout(fn, delay) {
    const t = setTimeout(fn, delay);
    effectTimeouts.push(t);
    return t;
}

function clearAllTimeouts() {
    effectTimeouts.forEach(t => clearTimeout(t));
    effectTimeouts = [];
}

startButton.addEventListener("click", () => {
    if (!running && !showingFailure && !showingGood) {
        if (performance.now() - lastResetTime < 300) return;
        startGame();
    } else if (running) {
        if (performance.now() - lastStartTime >= 5000) {
            stopGame();
        }
    }
});

/* 全体クリック（タップ）対応 */
document.addEventListener("click", (e) => {
    // ボタン自体のクリックは別処理
    if (e.target === startButton) return;

    if (showingFailure) {
        resetToInitialState();
    } else if (showingGood) {
        showingGood = false;
        startRoulette();
    }
});

/* キーボード（Enter / Space）対応 */
document.addEventListener("keydown", (e) => {
    if (e.repeat) return;

    if (e.code === "Enter" || e.code === "Space" || e.key === "Enter" || e.key === " ") {
        e.preventDefault();

        if (document.activeElement) {
            document.activeElement.blur();
        }

        if (running) {
            if (performance.now() - lastStartTime >= 5000) {
                stopGame();
            }
        }
        else if (showingFailure) {
            resetToInitialState();
        }
        else if (showingGood) {
            showingGood = false;
            startRoulette();
        }
        else if (showingResult && canAdvanceFromResult) {
            handleResultAdvance();
        }
        else if (rouletteOverlay.classList.contains("show")) {
            handleRouletteAction();
        }
        else if (!running && !showingResult && !rouletteOverlay.classList.contains("show")) {
            if (performance.now() - lastResetTime < 300) return;
            startGame();
        }
    }
});

effect.addEventListener("click", () => {
    if (showingResult && canAdvanceFromResult) {
        handleResultAdvance();
    }
});

function handleResultAdvance() {
    clearAllTimeouts();
    effect.classList.remove("dark");
    showingResult = false;
    canAdvanceFromResult = false;
    ctx.clearRect(0, 0, crackCanvas.width, crackCanvas.height);
    startRoulette();
}

rouletteOverlay.addEventListener("click", () => {
    handleRouletteAction();
});

function handleRouletteAction() {
    if (performance.now() - lastRouletteOpenTime < 400) return;

    if (rouletteSpinning) {
        stopRoulette();
    } else if (rouletteReadyToClose) {
        closeRouletteAndReset();
    }
}

function startGame() {
    if (running) return;

    clearAllTimeouts();

    if (timerId !== null) {
        cancelAnimationFrame(timerId);
        timerId = null;
    }

    running = true;
    showingResult = false;
    canAdvanceFromResult = false;
    showingFailure = false;
    showingGood = false;

    effect.classList.remove("dark");
    cutinOverlay.classList.remove("show");
    ctx.clearRect(0, 0, crackCanvas.width, crackCanvas.height);

    startTime = performance.now();
    lastStartTime = startTime;

    timer.textContent = "0.00";
    message.textContent = "11.11秒を狙え！";
    reward.textContent = "";

    startButton.textContent = "STOP";

    timerId = requestAnimationFrame(updateTimer);
}

function updateTimer() {
    if (!running) return;

    const elapsed = (performance.now() - startTime) / 1000;

    if (elapsed < VISIBLE_TIME) {
        timer.textContent = elapsed.toFixed(2);
    } else {
        timer.textContent = "？？？";
    }

    if (running) {
        timerId = requestAnimationFrame(updateTimer);
    }
}

function stopGame() {
    if (!running) return;

    running = false;
    if (timerId !== null) {
        cancelAnimationFrame(timerId);
        timerId = null;
    }

    if (document.activeElement) {
        document.activeElement.blur();
    }

    finalTime = (performance.now() - startTime) / 1000;
    
    const formattedString = finalTime.toFixed(2);
    const roundedTime = parseFloat(formattedString);

    startButton.textContent = "START";

    const diff = Math.abs(roundedTime - TARGET_TIME);

    let modeKey = TEST_MODE;

    if (modeKey === 0) {
        if (diff > RANGE_GOOD) modeKey = 1;
        else if (diff > RANGE_GREAT) modeKey = 2;
        else if (diff > RANGE_PERFECT) modeKey = 3;
        else modeKey = 4;
    }

    if (TEST_MODE !== 0) {
        if (modeKey === 4) displayTimeStr = "11.11";
        else if (modeKey === 3) displayTimeStr = "11.08";
        else if (modeKey === 2) displayTimeStr = "11.35";
        else displayTimeStr = "12.45";
    } else {
        displayTimeStr = formattedString;
    }

    if (modeKey === 4) earnedCount = 11;
    else if (modeKey === 3) earnedCount = 3;
    else if (modeKey === 2) earnedCount = 1;
    else earnedCount = 0;

    /* 1 (失敗)：フラグを立ててEnterかタップでタイトル画面（0.00）へ確実に復帰 */
    if (modeKey === 1) {
        showingFailure = true;
        timer.textContent = displayTimeStr;
        message.textContent = "残念。。また挑戦してね！ (Enterかタップでタイトルへ)";
    }

    /* 2 (1個獲得)：フラグを立ててEnterかタップでルーレットへ */
    else if (modeKey === 2) {
        showingGood = true;
        timer.textContent = displayTimeStr;
        message.textContent = "いいねまあ111年後に出直してきなよ";
        reward.textContent = "🎁 1個獲得！ (Enterかタップで分配へ)";
    }

    /* 3 (GREAT) / 4 (PERFECT)：演出へ */
    else {
        timer.textContent = "？？？";
        let modeName = (modeKey === 4) ? "perfect" : "great";
        showResult(displayTimeStr, modeName);
    }
}

function showResult(displayString, result) {
    showingResult = true;
    canAdvanceFromResult = false;
    playResultEffect(displayString, result);
}

function playResultEffect(displayString, result) {
    effect.className = "";
    resultDigits.className = "";
    resultType.textContent = "";
    resultReward.textContent = "";
    retryHint.classList.remove("show");

    resultDigits.innerHTML = "";
    resultType.textContent = "";
    resultReward.textContent = "";

    document.querySelectorAll(".particle").forEach(p => p.remove());

    addTimeout(() => {
        effect.classList.add("dark");
    }, 50);

    addTimeout(() => {
        showDigits(displayString, result);
    }, DARK_TIME + 50);
}

function setDigitsHTML(str) {
    resultDigits.innerHTML = "";
    for (let i = 0; i < str.length; i++) {
        const span = document.createElement("span");
        span.className = "digitChar";
        span.id = `digit_${i}`;
        span.textContent = str[i];
        resultDigits.appendChild(span);
    }
}

function triggerCutin(callback) {
    cutinOverlay.classList.remove("show");
    void cutinOverlay.offsetWidth;
    cutinOverlay.classList.add("show");

    addTimeout(() => {
        cutinOverlay.classList.remove("show");
        if (callback) callback();
    }, 2000);
}

function showDigits(displayString, result) {
    resultDigits.innerHTML = "";

    if (result === "perfect") {
        let fakeStr = "11.12";
        let index = 0;

        function stepFake() {
            index++;
            setDigitsHTML(fakeStr.substring(0, index));

            if (index < fakeStr.length) {
                addTimeout(stepFake, DIGIT_INTERVAL);
            } else {
                addTimeout(() => {
                    playGlassCrashEffect(() => {
                        triggerCutin(() => {
                            const lastChar = document.getElementById("digit_4");
                            if (lastChar) {
                                lastChar.classList.add("popOut");
                            }

                            addTimeout(() => {
                                setDigitsHTML("11.11");
                                const newLastChar = document.getElementById("digit_4");
                                if (newLastChar) {
                                    newLastChar.classList.add("pushUp");
                                }

                                addTimeout(() => {
                                    showJudgement(result);
                                }, 1200);
                            }, 500);
                        });
                    });
                }, 1200);
            }
        }
        stepFake();
        return;
    }

    const isMatchedTo11_1 = displayString.startsWith("11.1");
    let index = 0;

    function step() {
        index++;

        if (result === "great" && !isMatchedTo11_1 && index === 3) {
            setDigitsHTML(displayString.substring(0, 3));
            addTimeout(() => {
                setDigitsHTML(displayString);
                addTimeout(() => {
                    showJudgement(result);
                }, 600);
            }, 1000);
            return;
        }

        setDigitsHTML(displayString.substring(0, index));

        if (result === "great" && isMatchedTo11_1 && index === 4) {
            addTimeout(() => {
                playGlassCrashEffect(() => {
                    setDigitsHTML(displayString);
                    addTimeout(() => {
                        showJudgement(result);
                    }, 600);
                });
            }, 800);
            return;
        }

        if (index < displayString.length) {
            addTimeout(step, DIGIT_INTERVAL);
        } else {
            addTimeout(() => {
                showJudgement(result);
            }, 600);
        }
    }

    step();
}

function showJudgement(result) {
    if (result === "perfect") {
        resultType.textContent = "お前が一番";
        resultType.classList.add("perfect");
        resultReward.textContent = "🌈 11個獲得！";
        resultReward.classList.add("show");

        createParticles(120);

        addTimeout(() => {
            retryHint.classList.add("show");
            canAdvanceFromResult = true;
        }, 800);

    } else if (result === "great") {
        resultType.textContent = "11番目くらいには最高";
        resultType.classList.add("great");
        resultReward.textContent = "✨ 3個獲得！";
        resultReward.classList.add("show");

        addTimeout(() => {
            retryHint.classList.add("show");
            canAdvanceFromResult = true;
        }, 600);
    }
}

function playGlassCrashEffect(onComplete) {
    flash.classList.remove("active");
    void flash.offsetWidth;
    flash.classList.add("active");

    const cx = window.innerWidth / 2;
    const cy = window.innerHeight / 2;

    let lines = [];
    const mainBranches = 16;
    for (let i = 0; i < mainBranches; i++) {
        let angle = (Math.PI * 2 / mainBranches) * i + (Math.random() * 0.4 - 0.2);
        let currX = cx;
        let currY = cy;
        let points = [{x: currX, y: currY}];
        let steps = 8 + Math.floor(Math.random() * 4);

        for (let j = 0; j < steps; j++) {
            let dist = (Math.min(window.innerWidth, window.innerHeight) / steps) * (j + 1);
            angle += (Math.random() - 0.5) * 0.5;
            currX = cx + Math.cos(angle) * dist;
            currY = cy + Math.sin(angle) * dist;
            points.push({x: currX, y: currY});
        }
        lines.push(points);
    }

    ctx.clearRect(0, 0, crackCanvas.width, crackCanvas.height);
    ctx.strokeStyle = "rgba(255, 255, 255, 0.95)";
    ctx.lineWidth = 3.5;
    ctx.shadowColor = "#00ffff";
    ctx.shadowBlur = 14;

    lines.forEach(pts => {
        ctx.beginPath();
        ctx.moveTo(pts[0].x, pts[0].y);
        for (let i = 1; i < pts.length; i++) {
            ctx.lineTo(pts[i].x, pts[i].y);
        }
        ctx.stroke();
    });

    addTimeout(() => {
        ctx.clearRect(0, 0, crackCanvas.width, crackCanvas.height);
        onComplete();
    }, 2000);
}

function allocateItems(total) {
    let res = [0, 0, 0];
    for (let i = 0; i < total; i++) {
        const r = Math.floor(Math.random() * 3);
        res[r]++;
    }
    return res;
}

function startRoulette() {
    rouletteOverlay.classList.add("show");
    rouletteSpinning = true;
    rouletteReadyToClose = false;

    lastRouletteOpenTime = performance.now();

    rouletteTitle.textContent = `🎁 合計 ${earnedCount}個 を分配中… 🎁`;

    [slot0, slot1, slot2].forEach(s => {
        s.classList.remove("decided");
        s.textContent = "0";
    });

    rouletteResultText.textContent = "";
    rouletteHint.textContent = "Enterキーかタップでストップ！";
    rouletteHint.classList.add("show");

    finalAllocation = allocateItems(earnedCount);

    if (rouletteTimer !== null) {
        clearInterval(rouletteTimer);
    }

    rouletteTimer = setInterval(() => {
        slot0.textContent = Math.floor(Math.random() * (earnedCount + 1));
        slot1.textContent = Math.floor(Math.random() * (earnedCount + 1));
        slot2.textContent = Math.floor(Math.random() * (earnedCount + 1));
    }, 40);
}

function stopRoulette() {
    if (!rouletteSpinning) return;

    rouletteSpinning = false;
    if (rouletteTimer !== null) {
        clearInterval(rouletteTimer);
        rouletteTimer = null;
    }

    slot0.textContent = finalAllocation[0];
    slot1.textContent = finalAllocation[1];
    slot2.textContent = finalAllocation[2];

    [slot0, slot1, slot2].forEach(s => s.classList.add("decided"));

    const names = ["ポッキー", "プリッツ", "トッポ"];
    let summaryArr = [];
    for (let i = 0; i < 3; i++) {
        if (finalAllocation[i] > 0) {
            summaryArr.push(`${names[i]}×${finalAllocation[i]}`);
        }
    }

    const rewardSummary = summaryArr.join("、");
    rouletteResultText.textContent = "🎉 " + rewardSummary + " 獲得！";
    rouletteHint.textContent = "Enterキーかタップでタイトルに戻る";

    flash.classList.remove("active");
    void flash.offsetWidth;
    flash.classList.add("active");

    addTimeout(() => {
        rouletteReadyToClose = true;
        lastRouletteOpenTime = performance.now();
    }, 400);
}

function closeRouletteAndReset() {
    rouletteOverlay.classList.remove("show");
    rouletteReadyToClose = false;
    resetToInitialState();
}

/* タイトル画面（0.00）への完全初期化 */
function resetToInitialState() {
    running = false;
    showingResult = false;
    canAdvanceFromResult = false;
    showingFailure = false;
    showingGood = false;

    lastResetTime = performance.now();

    clearAllTimeouts();

    if (timerId !== null) {
        cancelAnimationFrame(timerId);
        timerId = null;
    }

    timer.textContent = "0.00";
    message.textContent = "STARTを押して11.11秒を目指せ！";
    reward.textContent = "";
    startButton.textContent = "START";

    if (document.activeElement) {
        document.activeElement.blur();
    }
}

function createParticles(count) {
    for (let i = 0; i < count; i++) {
        const particle = document.createElement("div");
        particle.className = "particle";

        const x = window.innerWidth / 2;
        const y = window.innerHeight / 2;

        particle.style.left = `${x}px`;
        particle.style.top = `${y}px`;

        const angle = Math.random() * Math.PI * 2;
        const velocity = Math.random() * 320 + 100;
        const tx = Math.cos(angle) * velocity;
        const ty = Math.sin(angle) * velocity;

        effect.appendChild(particle);

        particle.animate([
            { transform: 'translate(0, 0) scale(1)', opacity: 1 },
            { transform: `translate(${tx}px, ${ty}px) scale(0)`, opacity: 0 }
        ], {
            duration: Math.random() * 1000 + 800,
            easing: 'cubic-bezier(0.1, 0.8, 0.3, 1)',
            fill: 'forwards'
        });
    }
}
